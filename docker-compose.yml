
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  app:
    image: anmol122/anmol-mern-app:latest
    ports:
      - "8081:5000"
    environment:
      MONGO_URI: mongodb://mongo:27017/mern_demo
    depends_on:
      - mongo
    restart: unless-stopped

volumes:
  mongo-data:
