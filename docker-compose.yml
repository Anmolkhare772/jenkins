services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  app:
    build: .
    ports:
      - "8080:5000"
    environment:
      MONGO_URI: mongodb://mongo:27017/mern_demo
    depends_on:
      - mongo
    restart: unless-stopped

volumes:
  mongo-data: